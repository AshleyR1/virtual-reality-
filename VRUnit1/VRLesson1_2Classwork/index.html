<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
       <a-box position="-1 1.5 -3" rotation="0 90 0" color="#5075B5"></a-box>

      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
       <a-sphere position="-5 1.25 -5" radius="1.25" color="#9C0006"></a-sphere>
       <a-sphere position="5 1.25 -5" radius="1.25" color="#8F1D21"></a-sphere>

       <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#B5506B"></a-cylinder>
        <a-cylinder position="1 0.64 -2" radius="0.6" height="1.3" color="#50B57D"></a-cylinder>
<a-cylinder position="1.1 0.64 -1" radius="0.7" height="1." color="#A6B550"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#F78E02"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
